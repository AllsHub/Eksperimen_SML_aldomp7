name: Automasi Preprocessing Data

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9' 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Preprocessing Script
        run: |
          # Script ini akan menghasilkan file di folder preprocessing/namadataset_preprocessing/
          python preprocessing/automate_aldomp7.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Menambahkan file hasil
          git add preprocessing/namadataset_preprocessing/breastcancer_preprocessing.csv
          
          # Cek status
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan pada data. Skipping commit."
          else
            git commit -m "Auto-update: Dataset preprocessing terbaru [skip ci]"
            git push
          fi
