name: Automasi Preprocessing Data

# Trigger: Workflow jalan setiap ada 'push' ke branch 'main'
# bisa mengubah 'main' menjadi 'master' jika itu nama branch utama
on:
  push:
    branches:
      - main
  # Opsi ini agar bisa menjalankan workflow secara manual dari tab Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-process:
    runs-on: ubuntu-latest

    steps:
      # 1. Mengambil kode dari repository (Checkout)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Menyiapkan Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9' 

      # 3. Install Dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Menjalankan Script Preprocessing Anda
      - name: Run Preprocessing Script
        run: |
          python preprocessing/automate_aldomp7.py

      # 5. Commit dan Push hasilnya kembali ke Repo
      # Langkah ini mengecek apakah ada file berubah. Jika ada, dia akan commit.
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Tambahkan file hasil preprocessing ke staging
          git add preprocessing/namadataset_preprocessing/breastcancer_preprocessing.csv
          
          # Cek status, commit jika ada perubahan
          if git diff --staged --quiet; then
            print("Tidak ada perubahan pada data. Skipping commit.")
          else
            git commit -m "Auto-update: Dataset preprocessing terbaru [skip ci]"
            git push
          fi
